name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wasm/probe.cpp'
      - 'wasm/compiler.cpp'
      - 'wasm/build-gbrecomp-probe.sh'
      - 'versions.env'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebAssembly build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake ninja-build git python3

      - name: Build real GB Recompiled WebAssembly core
        run: ./wasm/build-gbrecomp-probe.sh

      - name: Smoke-test browser recompilation
        run: |
          python3 fixtures/make_basicdemo.py
          node wasm/compiler.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb

      - name: Stage WebAssembly runtime into site
        run: |
          mkdir -p site/wasm
          cp build/wasm/dist/gbrecomp_probe.js site/wasm/
          cp build/wasm/dist/gbrecomp_probe.wasm site/wasm/
          touch site/.nojekyll
          ls -lh site/wasm/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload playground
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'wasm/**'
      - 'sgdk_runtime/**'
      - 'src/**'
      - 'sgdk/template/**'
      - 'versions.env'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install WebAssembly build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake ninja-build git python3

      - name: Build real GB Recompiled WebAssembly core
        run: ./wasm/build-gbrecomp-probe.sh

      - name: Smoke-test browser recompilation
        run: |
          python3 fixtures/make_basicdemo.py
          node wasm/compiler.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb

      - name: Install pinned browser m68k GCC/binutils toolchain and browser test harness
        run: |
          . ./versions.env
          npm install --no-save --no-package-lock --ignore-scripts \
            "${ROMDEV_M68K_WASM_PACKAGE}@${ROMDEV_M68K_WASM_VERSION}" \
            playwright-core@1.56.1

      - name: Build mapper-enabled SGDK seed for browser far-ROM
        run: |
          . ./versions.env
          CFG="node_modules/${ROMDEV_M68K_WASM_PACKAGE}/share/genesis/lib/sgdk/include/config.h"
          python3 - "$CFG" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          old = '#define ENABLE_BANK_SWITCH      0'
          new = '#define ENABLE_BANK_SWITCH      1'
          if old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('ENABLE_BANK_SWITCH marker not found')
          PY
          node wasm/rebuild-mapper-sgdk-seed.mjs
          grep -q '#define ENABLE_BANK_SWITCH      1' "$CFG"
          test -s "node_modules/${ROMDEV_M68K_WASM_PACKAGE}/share/genesis/lib/sgdk/libmd.seed.a"
          test -s "node_modules/${ROMDEV_M68K_WASM_PACKAGE}/share/genesis/lib/sgdk/libmd.seed.hash"

      - name: Prove end-to-end WebAssembly build before packaging
        run: |
          node wasm/gb-to-genesis-rom.mjs \
            build/wasm/dist/gbrecomp_probe.js \
            build/wasm/dist/gbrecomp_probe.wasm \
            fixtures/basicdemo.gb \
            build/pages-e2e/rom.bin
          test -s build/pages-e2e/rom.bin
          sha256sum build/pages-e2e/rom.bin

      - name: Stage recompiler and target toolchain into site
        run: |
          . ./versions.env
          PKG="node_modules/${ROMDEV_M68K_WASM_PACKAGE}"
          test -d "$PKG/wasm"
          test -d "$PKG/build"
          test -d "$PKG/share/genesis/lib"

          rm -rf site/wasm site/toolchain site/runtime
          mkdir -p site/wasm site/toolchain site/runtime site/toolchain/notices

          cp build/wasm/dist/gbrecomp_probe.js site/wasm/
          cp build/wasm/dist/gbrecomp_probe.wasm site/wasm/
          cp -R "$PKG/wasm" site/toolchain/wasm
          cp -R "$PKG/build" site/toolchain/build
          cp -R "$PKG/share/genesis/lib" site/toolchain/share
          cp site/toolchain-node-module-shim.mjs site/toolchain/wasm/node-module-shim.mjs
          cp "$PKG/package.json" site/toolchain/notices/romdev-toolchain-package.json
          cp "$PKG/README.md" site/toolchain/notices/ROMDEV_TOOLCHAIN_README.md
          find "$PKG" -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) \
            -exec cp {} site/toolchain/notices/ \; || true
          cp THIRD_PARTY.md site/toolchain/notices/GBC_TO_MD_THIRD_PARTY.md

          # Emscripten's ES-module glue retains a Node `module` import even in
          # browser-capable builds. Bare Node specifiers are illegal in a Web
          # Worker without an import map, so point them at a local shim while
          # the Worker supplies wasmBinary and MEMFS explicitly.
          python3 - <<'PY'
          from pathlib import Path
          root = Path('site/toolchain/wasm')
          changed = []
          for p in root.glob('*.mjs'):
              text = p.read_text(encoding='utf-8')
              patched = (text
                  .replace('from"module"', 'from"./node-module-shim.mjs"')
                  .replace("from'module'", "from'./node-module-shim.mjs'")
                  .replace('import("module")', 'import("./node-module-shim.mjs")')
                  .replace("import('module')", "import('./node-module-shim.mjs')")
                  .replace('from"node:module"', 'from"./node-module-shim.mjs"')
                  .replace("from'node:module'", "from'./node-module-shim.mjs'")
                  .replace('import("node:module")', 'import("./node-module-shim.mjs")')
                  .replace("import('node:module')", "import('./node-module-shim.mjs')"))
              if patched != text:
                  p.write_text(patched, encoding='utf-8')
                  changed.append(p.name)
          if not changed:
              raise SystemExit('No Emscripten Node module import found to browserize')
          offenders = []
          for p in root.glob('*.mjs'):
              if p.name == 'node-module-shim.mjs':
                  continue
              text = p.read_text(encoding='utf-8')
              for needle in ('from"module"', "from'module'", 'import("module")', "import('module')",
                             'from"node:module"', "from'node:module'", 'import("node:module")', "import('node:module')"):
                  if needle in text:
                      offenders.append(f'{p.name}: {needle}')
          if offenders:
              raise SystemExit('Unpatched Node module specifier remains: ' + ', '.join(offenders))
          print('browserized glue:', ', '.join(changed))
          PY

          cp sgdk_runtime/src/gbrt_sgdk_min.c site/runtime/
          cp sgdk_runtime/src/gbrt_cpu.c site/runtime/
          cp sgdk_runtime/include/gbrt.h site/runtime/
          cp src/gbmd_backend.c src/gbmd_backend.h site/runtime/
          cp sgdk/template/src/main.c site/runtime/main.c

          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('site/toolchain/share')
          paths = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          Path('site/toolchain/share-manifest.json').write_text(json.dumps(paths, separators=(',', ':')), encoding='utf-8')
          print(f'share manifest: {len(paths)} files')
          PY

          touch site/.nojekyll
          test -f site/toolchain/wasm/cc1-m68k.mjs
          test -f site/toolchain/wasm/cc1-m68k.wasm
          test -f site/toolchain/wasm/m68k-elf-as.mjs
          test -f site/toolchain/wasm/m68k-elf-ld.mjs
          test -f site/toolchain/wasm/m68k-elf-objcopy.mjs
          test -f site/toolchain/share/sgdk/libmd.seed.a
          grep -q '#define ENABLE_BANK_SWITCH      1' site/toolchain/share/sgdk/include/config.h
          test -f site/runtime/gbrt_sgdk_min.c
          test -f site/runtime/gbrt_cpu.c
          du -sh site site/toolchain/wasm site/toolchain/share

      - name: Run real playground end-to-end in Chromium
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
          node wasm/playground.e2e.mjs site fixtures/basicdemo.gb

          python3 fixtures/make_mbc5test.py
          PLAYGROUND_PORT=4174 node wasm/playground.e2e.mjs \
            site fixtures/mbc5test.gb fixtures/mbc5test.annotations

      - name: Upload packaged playground for inspection
        uses: actions/upload-artifact@v4
        with:
          name: gbc-to-md-playground-site
          path: site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: WASM probe

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - 'versions.env'
      - 'scripts/build-wasm-sgdk-bridge.sh'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Emscripten build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake ninja-build git python3
      - name: Generate synthetic fixtures
        run: |
          python3 fixtures/make_basicdemo.py
          python3 fixtures/make_mbc1test.py
      - name: Build pinned GB Recompiled core as WebAssembly
        run: ./wasm/build-gbrecomp-probe.sh
      - name: Exercise the WebAssembly probe
        run: |
          node wasm/probe.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb 2 0
          node wasm/probe.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/mbc1test.gb 4 3
      - name: Generate and prepare SGDK C in memory through WebAssembly
        run: node wasm/compiler.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb
      - name: Record sizes and hashes
        run: |
          wc -c build/wasm/dist/gbrecomp_probe.js build/wasm/dist/gbrecomp_probe.wasm
          sha256sum build/wasm/dist/gbrecomp_probe.js build/wasm/dist/gbrecomp_probe.wasm
      - name: Upload WebAssembly proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: |
            build/wasm/dist/gbrecomp_probe.js
            build/wasm/dist/gbrecomp_probe.wasm

  clang-m68k-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install LLVM WebAssembly build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake ninja-build git python3 llvm-15-tools
          node --version
      - name: Build reduced Clang with only the M68k backend as WebAssembly
        env:
          JOBS: '2'
        run: ./wasm/llvm/build-clang-m68k.sh
      - name: Compile freestanding C to a Motorola 68000 object in WebAssembly
        run: |
          mkdir -p build/clang-m68k-wasm/proof
          node wasm/llvm/clang-m68k.test.cjs \
            build/clang-m68k-wasm/dist/clang-m68k.js \
            build/clang-m68k-wasm/dist/clang-m68k.wasm \
            wasm/llvm/hello.c \
            build/clang-m68k-wasm/proof/hello.o
          llvm-readelf-15 -h build/clang-m68k-wasm/proof/hello.o
          llvm-objdump-15 -d build/clang-m68k-wasm/proof/hello.o || true
      - name: Record browser compiler sizes and hashes
        run: |
          wc -c build/clang-m68k-wasm/dist/clang-m68k.js build/clang-m68k-wasm/dist/clang-m68k.wasm
          sha256sum build/clang-m68k-wasm/dist/clang-m68k.js build/clang-m68k-wasm/dist/clang-m68k.wasm
      - name: Upload browser M68k compiler proof
        uses: actions/upload-artifact@v4
        with:
          name: clang-m68k-wasm
          path: |
            build/clang-m68k-wasm/dist/clang-m68k.js
            build/clang-m68k-wasm/dist/clang-m68k.wasm
            build/clang-m68k-wasm/proof/hello.o

  generated-c-m68k:
    needs: [probe, clang-m68k-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download GB Recompiled WebAssembly
        uses: actions/download-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: build/wasm/dist
      - name: Download browser M68k Clang
        uses: actions/download-artifact@v4
        with:
          name: clang-m68k-wasm
          path: build/clang-m68k-wasm/dist
      - name: Generate browser integration fixture
        run: python3 fixtures/make_basicdemo.py
      - name: Compile real GB Recompiled C units to Motorola 68000 objects
        run: |
          mkdir -p build/browser-m68k-objects
          node wasm/llvm/gbrecomp-generated-m68k.test.cjs \
            build/wasm/dist/gbrecomp_probe.js \
            build/wasm/dist/gbrecomp_probe.wasm \
            build/clang-m68k-wasm/dist/clang-m68k.js \
            build/clang-m68k-wasm/dist/clang-m68k.wasm \
            fixtures/basicdemo.gb \
            build/browser-m68k-objects
          file build/browser-m68k-objects/*.o
      - name: Upload browser-generated game objects
        uses: actions/upload-artifact@v4
        with:
          name: gbrecomp-m68k-objects
          path: build/browser-m68k-objects/

  sgdk-bridge:
    needs: probe
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install SGDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils curl git python3 ca-certificates \
            openjdk-17-jre-headless
          node --version
      - name: Cache SGDK dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps/downloads
          key: gbc-to-md-sgdk-deps-${{ hashFiles('versions.env') }}
      - name: Bootstrap SGDK and m68k toolchain
        run: make bootstrap-sgdk
      - name: Generate bridge fixture
        run: python3 fixtures/make_basicdemo.py
      - name: Download WebAssembly artifact from probe job
        uses: actions/download-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: build/wasm/dist
      - name: Link WASM-generated sources with the real SGDK toolchain
        run: ./scripts/build-wasm-sgdk-bridge.sh
      - name: Upload bridge Mega Drive ROM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sgdk-bridge-rom
          path: build/artifacts/wasm-bridge/

name: Browser toolchain

on:
  push:
    branches: [main]
    paths:
      - 'wasm/**'
      - 'versions.env'
      - 'scripts/build-wasm-sgdk-bridge.sh'
      - 'sgdk_runtime/**'
      - 'src/**'
      - 'sgdk/template/**'
      - '.github/workflows/wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recompiler-wasm:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Emscripten build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake ninja-build git python3
      - name: Generate synthetic fixtures
        run: |
          python3 fixtures/make_basicdemo.py
          python3 fixtures/make_mbc1test.py
      - name: Build pinned GB Recompiled core as WebAssembly
        run: ./wasm/build-gbrecomp-probe.sh
      - name: Exercise the WebAssembly recompiler
        run: |
          node wasm/probe.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb 2 0
          node wasm/probe.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/mbc1test.gb 4 3
          node wasm/compiler.test.cjs build/wasm/dist/gbrecomp_probe.js fixtures/basicdemo.gb
      - name: Record sizes and hashes
        run: |
          wc -c build/wasm/dist/gbrecomp_probe.js build/wasm/dist/gbrecomp_probe.wasm
          sha256sum build/wasm/dist/gbrecomp_probe.js build/wasm/dist/gbrecomp_probe.wasm
      - name: Upload WebAssembly recompiler
        uses: actions/upload-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: |
            build/wasm/dist/gbrecomp_probe.js
            build/wasm/dist/gbrecomp_probe.wasm

  genesis-gcc-wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned WebAssembly m68k GCC/binutils package
        run: npm install --no-save --no-package-lock --ignore-scripts romdev-toolchain-m68k-gcc@0.3.0
      - name: Build a complete Genesis ROM using only WebAssembly tools
        run: node wasm/romdev-genesis-smoke.mjs build/romdev-wasm-smoke/rom.bin
      - name: Record ROM size and hash
        run: |
          wc -c build/romdev-wasm-smoke/rom.bin
          sha256sum build/romdev-wasm-smoke/rom.bin
      - name: Upload WebAssembly-only Genesis ROM
        uses: actions/upload-artifact@v4
        with:
          name: genesis-wasm-toolchain-rom
          path: build/romdev-wasm-smoke/rom.bin

  gb-to-genesis-wasm:
    needs: [recompiler-wasm, genesis-gcc-wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned WebAssembly m68k GCC/binutils package
        run: npm install --no-save --no-package-lock --ignore-scripts romdev-toolchain-m68k-gcc@0.3.0
      - name: Download GB Recompiled WebAssembly
        uses: actions/download-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: build/wasm/dist
      - name: Generate browser end-to-end fixture
        run: python3 fixtures/make_basicdemo.py
      - name: Recompile Game Boy ROM and build Genesis ROM using only WebAssembly toolchains
        run: |
          node wasm/gb-to-genesis-rom.mjs \
            build/wasm/dist/gbrecomp_probe.js \
            build/wasm/dist/gbrecomp_probe.wasm \
            fixtures/basicdemo.gb \
            build/browser-e2e/rom.bin
      - name: Validate end-to-end ROM artifact
        run: |
          test -s build/browser-e2e/rom.bin
          wc -c build/browser-e2e/rom.bin
          sha256sum build/browser-e2e/rom.bin
      - name: Upload browser end-to-end Mega Drive ROM
        uses: actions/upload-artifact@v4
        with:
          name: gbc-to-md-browser-e2e-rom
          path: build/browser-e2e/rom.bin

  native-sgdk-reference:
    needs: recompiler-wasm
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install SGDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils curl git python3 ca-certificates \
            openjdk-17-jre-headless
          node --version
      - name: Cache SGDK dependency downloads
        uses: actions/cache@v4
        with:
          path: .deps/downloads
          key: gbc-to-md-sgdk-deps-${{ hashFiles('versions.env') }}
      - name: Bootstrap SGDK and native m68k toolchain
        run: make bootstrap-sgdk
      - name: Generate reference fixture
        run: python3 fixtures/make_basicdemo.py
      - name: Download WebAssembly recompiler artifact
        uses: actions/download-artifact@v4
        with:
          name: gbrecomp-wasm-probe
          path: build/wasm/dist
      - name: Link WASM-generated sources with native SGDK toolchain
        run: ./scripts/build-wasm-sgdk-bridge.sh
      - name: Upload native reference ROM
        uses: actions/upload-artifact@v4
        with:
          name: wasm-sgdk-bridge-rom
          path: build/artifacts/wasm-bridge/
